[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanme"
version = "2.0.0"
description = "Cybersecurity reconnaissance & scanning toolkit — async port scanning, CMS detection, DNS recon, and more."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "NightzDev"}]
keywords = ["cybersecurity", "scanner", "recon", "pentesting", "cms-detection", "port-scanner", "dns", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

dependencies = [
    "rich>=13.0",
    "aiohttp>=3.9",
    "dnspython>=2.4",
    "python-whois>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/NightzDev/scanme"
Repository = "https://github.com/NightzDev/scanme"
Issues = "https://github.com/NightzDev/scanme/issues"

[project.scripts]
scanme = "scanme.__main__:main"

[tool.setuptools.packages.find]
include = ["scanme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py310"
line-length = 120
